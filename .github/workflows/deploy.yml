name: Deploy

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily: refresh videos.json from the approved channels
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Seed with currently deployed data (stale fallback for broken channels)
        run: curl -fsSL "https://pathikrit.github.io/TinyTube/videos.json" -o /tmp/seed.json || true
      - name: Build
        run: make prod DOWNLOAD_FLAGS="--seed /tmp/seed.json"
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
